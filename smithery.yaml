# Smithery configuration for Compliance & Sanções
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_compliance

name: compliance-mcp
displayName: "Compliance & Sanções"
description: >
  Due diligence e KYC: PEP (pessoa exposta politicamente), sanções nacionais e internacionais (OFAC, ONU, UE, Reino Unido, FBI, INTERPOL, FINCEN), idoneidade (CEIS/CNEP/CEAF/CEPIM), improbidade, mandados de prisão, antecedentes criminais, leniência e trabalho forçado. Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/compliance-mcp
repository: https://github.com/mcp-dir/compliance-mcp

tags:
  - compliance
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_compliance

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_compliance/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
